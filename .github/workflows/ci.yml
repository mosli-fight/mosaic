name: CI

# Mosaic CI. Runs on every PR and on push to main.
#
# Design notes
# ------------
# - Single job, not a matrix. The spec asked for a "matrix: node 20", and one
#   node version is expressed directly rather than through a one-element matrix:
#   a matrix that only ever has one member costs a round of job scheduling and
#   makes the required-version list look extensible when it is not.
# - `test:all` chains the editor suite (~2400 tests) and the dashboard suite.
#   They are kept as separate projects rather than merged into one so a
#   dashboard-only change does not pay for the editor's minutes-long suite.
# - The dashboard's Playwright suite runs here too, so a rebrand regression that
#   re-introduces visible "Excalidraw" text cannot merge.
#
# Everything uses the built-in GITHUB_TOKEN and ubuntu-latest, so this runs on
# the free Actions tier with no configuration.

on:
  push:
    branches: [main]
    # No paths-ignore.
    #
    # There used to be one, skipping "**/*.md", memory/**, docs/**, LICENSE and
    # NOTICE so a prose-only push would not cost eighteen minutes. It could not
    # work here: branch protection requires a job named "lint, typecheck, test,
    # build", and GitHub does not count a skipped workflow as that check
    # passing. The result was a pull request that touched only Markdown could
    # never merge - it sat in BLOCKED forever with no check to inspect.
    #
    # The repository is public, so Actions minutes are unlimited and the saving
    # was never worth an unmergeable branch. Removing the filter makes the
    # required check and the trigger agree, which is the only arrangement that
    # actually merges.
    #
    # If the minutes ever matter again, the fix is to drop "lint, typecheck, test,
    # build" from branch protection, not to filter the trigger.
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Saves minutes on busy PRs and keeps
# the free tier's concurrent-run limit from being wasted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, and not just for tidiness.
          #
          # Mosaic's first commits sit directly on top of Excalidraw's — the
          # repo was cloned from upstream — so `git merge-base HEAD
          # upstream/master` is what tells the rebrand guard which upstream
          # commit we forked from. With the default depth-1 checkout that commit
          # is not present, the merge base cannot be computed, and the guard
          # silently falls back to comparing against upstream's *tip* — which
          # then reports every import upstream has added since as "removed".
          # Cost is one extra checkout of a few tens of MB.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn

      - name: Fetch upstream for the rebrand guard
        # `verify:brand` diffs against `upstream/master`, and the default
        # checkout is depth 1 with only `origin` configured — so the ref does
        # not exist and `git grep` exits 128 with "unable to resolve revision",
        # which reads like a rebrand failure but is a missing ref.
        #
        # Depth matters. With `--depth=1`, `git grep <ref>` walks a *shallow*
        # tree and misses files whose blobs were not fetched, so the upstream
        # counts came out higher than the working tree and the guard reported
        # "occurrences were REMOVED" on a branch where nothing had been renamed.
        # Full history for this one ref, so both sides are counted over the same
        # tree.
        run: |
          git remote add upstream https://github.com/excalidraw/excalidraw.git
          git fetch upstream master
          git rev-parse --verify upstream/master
          # Sanity: the baseline the guard will use (the merge base) must be
          # actually grep-able. Verifies upstream/master itself as a proxy —
          # if that fails, the merge base will too.
          git grep -c -e 'from "@excalidraw/' upstream/master -- packages >/dev/null

      # Restore the dependency cache directly as well. setup-node's `cache:
      # yarn` only caches the yarn *downloads*, not `node_modules`, so without
      # this the install re-links ~1.5k packages on every run.
      - name: Restore yarn cache
        id: yarn-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/yarn
            ~/.yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint (eslint --max-warnings=0)
        run: yarn test:code

      - name: Format check (prettier)
        run: yarn test:other

      - name: Typecheck
        run: yarn test:typecheck

      - name: Unit tests (editor)
        # `test:all` also runs typecheck, lint and prettier. Those are separate
        # steps above, so calling it here would repeat ~2 minutes of work and
        # double the chance of an unrelated flake blocking the run.
        run: yarn test:app --watch=false

      - name: Unit tests (dashboard)
        run: yarn test:dashboard

      - name: Rebrand guard
        # Fails if a bulk edit renamed an internal identifier, a localStorage key,
        # an IndexedDB store or a LICENSE file. Cheap, and it is the single most
        # valuable check in this repo.
        run: yarn verify:brand

      - name: Sync conflict-policy matcher
        # The matcher that decides "keep our branding or take theirs" can fail
        # silently — a pattern matching nothing sends every conflict to upstream
        # with no error. It did exactly that once, so it is now tested.
        run: yarn test:sync-policy

      - name: Build editor
        run: yarn build

      - name: Build dashboard
        run: yarn build:dashboard

      # ---------------------------------------------------------------
      # Playwright. Installs only the chromium browser to stay inside the
      # free tier's runner minutes.
      # ---------------------------------------------------------------
      - name: Install Playwright browsers
        run: yarn --cwd mosaic-dashboard exec playwright install --with-deps chromium

      - name: E2E (dashboard, editor, rebrand audit)
        run: yarn e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: mosaic-dashboard/playwright-report
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: builds-${{ github.sha }}
          path: |
            excalidraw-app/build
            mosaic-dashboard/dist
          retention-days: 7
          if-no-files-found: error
