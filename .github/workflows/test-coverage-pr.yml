name: Test Coverage PR
on:
  # Coverage reports, not a gate. This repository has no branch protection and no
  # required checks, so a coverage comment on a pull request stops nothing that is
  # not already stopped by ci.yml - which runs the whole suite regardless - while
  # costing a second full test run with instrumentation, about twelve minutes per
  # push. Running it on main instead reports the same number once per merge.
  #
  # The account exhausted its 2,000 free Actions minutes, mostly on repeated
  # versions of this job; see the note in ci.yml.
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.x"
      - name: "Install Deps"
        run: yarn install
      - name: "Test Coverage"
        run: yarn test:coverage
      - name: "Report Coverage"
        if: always() # Also generate the report if tests are failing
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
